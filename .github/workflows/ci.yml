name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openformat
          POSTGRES_PASSWORD: openformat
          POSTGRES_DB: openformat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openformat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install poetry
          cd apps/api && poetry install
          cd ../worker && poetry install
      
       - name: Run API Tests with Coverage Gate
        env:
          DATABASE_URL: postgresql+asyncpg://openformat:openformat@localhost:5432/openformat
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          SECRET_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          cd apps/api
          poetry run alembic upgrade head
          poetry run pytest
          
      - name: Run Worker Tests 
        env:
          DATABASE_URL: postgresql://openformat:openformat@localhost:5432/openformat
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
        run: |
          cd apps/worker
          poetry run pytest