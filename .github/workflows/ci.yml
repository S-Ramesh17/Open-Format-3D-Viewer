name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff lint
        run: poetry run ruff check app/ tests/ || true
      - name: Type check
        run: poetry run mypy app/ --ignore-missing-imports || true

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openformat
          POSTGRES_PASSWORD: openformat
          POSTGRES_DB: openformat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://openformat:openformat@localhost:5432/openformat_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /tmp/openformat_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run migrations
        run: poetry run alembic upgrade head
      - name: Run API tests
        run: poetry run pytest tests/ -v --tb=short --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
        continue-on-error: true

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    defaults:
      run:
        working-directory: apps/worker
    env:
      DATABASE_URL: postgresql://openformat:openformat@localhost:5432/openformat
      REDIS_URL: redis://localhost:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /tmp/openformat_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run worker tests
        run: poetry run pytest tests/ -v --tb=short

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-api, test-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t openformat-api apps/api/
      - name: Build Worker image
        run: docker build -t openformat-worker apps/worker/
      - name: Build WS image
        run: docker build -t openformat-ws apps/ws-server/