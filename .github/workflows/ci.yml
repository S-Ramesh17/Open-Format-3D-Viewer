name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openformat
          POSTGRES_PASSWORD: openformat
          POSTGRES_DB: openformat
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install poetry
          cd apps/api && poetry install
      
      - name: Run API Tests with Coverage Gate
        env:
          DATABASE_URL: postgresql+asyncpg://openformat:openformat@localhost:5432/openformat
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: |
          cd apps/api
          poetry run pytest