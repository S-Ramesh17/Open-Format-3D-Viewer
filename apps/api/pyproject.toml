[project]
name = "openformat-api"
version = "0.1.0"
description = "Open Format 3D Viewer API"
authors = [
    {name = "Ramesh S"}
]
requires-python = ">=3.12,<4.0"
package-mode = false
dependencies = [
    "fastapi (>=0.137.0,<0.138.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "bcrypt (<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "boto3 (>=1.43.34,<2.0.0)",
    "bleach (>=6.4.0,<7.0.0)",
    "sentry-sdk[fastapi] (>=2.63.0,<3.0.0)",
    "python-magic-bin (>=0.4.14,<0.5.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"