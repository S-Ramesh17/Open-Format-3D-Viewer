[tool.poetry]
name = "openformat-api"
version = "0.1.0"
description = "Open Format 3D Model Processing API"
authors = ["-"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

# Web framework
fastapi           = "^0.115.0"
uvicorn           = { extras = ["standard"], version = "^0.32.0" }
gunicorn          = "^23.0.0"

# Database
sqlalchemy        = { extras = ["asyncio"], version = "^2.0.36" }
alembic           = "^1.14.0"
asyncpg           = "^0.30.0"
psycopg2-binary   = "^2.9.10"   # sync driver for Alembic migrations

# Auth & security
# python-jose (not pyjwt) — security.py uses `from jose import jwt`
python-jose       = { extras = ["cryptography"], version = "^3.3.0" }
passlib           = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart  = "^0.0.18"

# OAuth
authlib           = "^1.3.0"    # oauth.py: authlib.integrations.starlette_client

# Cloud & storage
boto3             = "^1.35.0"   # botocore is a transitive dep; no explicit pin needed

# Task queue / cache
celery            = { extras = ["redis"], version = "^5.4.0" }
redis             = "^5.2.0"

# Observability
sentry-sdk        = { extras = ["fastapi"], version = "^2.19.0" }

# Utilities
pydantic          = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.7.0"
bleach            = "^6.2.0"    # sanitize.py: bleach.clean()
httpx             = "^0.28.0"   # used in tests & OAuth callbacks
filetype          = "^1.2.0"    # storage.py: filetype.guess()
itsdangerous      = "^2.2.0"    # starlette SessionMiddleware indirect dep — keep explicit
bcrypt = "4.0.1"

[tool.poetry.group.dev.dependencies]
pytest            = "^8.3.0"
pytest-asyncio    = "^0.24.0"
pytest-cov        = "^6.0.0"
httpx             = "^0.28.0"
black             = "^24.10.0"
ruff              = "^0.8.0"
mypy              = "^1.13.0"

[build-system]
requires      = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"