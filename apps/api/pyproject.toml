[tool.poetry]
name = "openformat-api"
version = "0.1.0"
description = "Open Format 3D Model Processing API"
authors = ["-"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
gunicorn = "^23.0.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"

# Auth & security
pyjwt = {extras = ["crypto"], version = "^2.10.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^43.0.0"
python-multipart = "^0.0.18"

# Cloud & storage
boto3 = "^1.35.0"
botocore = "^1.35.0"

# Task queue
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.2.0"

# Observability
sentry-sdk = {extras = ["fastapi"], version = "^2.19.0"}

# Utilities
pydantic = {extras = ["email"], version = "^2.10.0"}
pydantic-settings = "^2.7.0"
bleach = "^6.2.0"
python-dotenv = "^1.0.1"
httpx = "^0.28.0"

# Works on Windows (dev), Linux (Render), macOS (CI) without any system library.
filetype = "^1.2.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
black = "^24.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
itsdangerous = ">=2.1.2,<3.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"