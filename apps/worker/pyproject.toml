[project]
name = "openformat-worker"
version = "0.1.0"
description = "Open Format Celery worker"
requires-python = "^3.12"
package-mode = false
dependencies = [
    "celery[redis] (>=5.4.0,<6.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "sqlalchemy[asyncio] (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "sentry-sdk[celery] (>=2.63.0,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"