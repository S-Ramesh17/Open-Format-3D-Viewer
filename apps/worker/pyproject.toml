[project]
name = "openformat-worker"
version = "0.1.0"
description = "Open Format Celery worker"
requires-python = ">=3.12"
package-mode = false
dependencies = [
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    # Sync SQLAlchemy + psycopg2 for Celery task DB access
    "sqlalchemy>=2.0.50,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "boto3>=1.35.0,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "sentry-sdk[celery]>=2.63.0,<3.0.0",
    # IFC parsing — install separately in production image from conda-forge
    # ifcopenshell is not on PyPI; document separately
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
