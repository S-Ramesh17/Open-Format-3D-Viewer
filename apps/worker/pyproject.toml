[tool.poetry]
name = "openformat-worker"
version = "0.1.0"
description = "Open Format Celery worker"
authors = ["-"]
package-mode = false

[tool.poetry.dependencies]
python            = ">=3.12,<3.13"
requests = "^2.34.2"

# Task queue / broker
celery            = { extras = ["redis"], version = "^5.4.0" }
redis             = "^5.2.0"

# Database (sync — worker uses create_engine, not async)
sqlalchemy        = "^2.0.36"
psycopg2-binary   = "^2.9.10"

# Cloud & storage
boto3             = "^1.35.0"

# Config
pydantic-settings = "^2.7.0"

# Observability
sentry-sdk        = { extras = ["celery"], version = "^2.19.0" }

prometheus-client  = "^0.21.0"

# Mesh processing — STL + OBJ pipelines
# trimesh[easy] brings in numpy, scipy, shapely, rtree etc.
# If the Render build fails on pyembree/manifold3d native code,
# replace `trimesh[easy]` with `trimesh` (bare) and add `numpy` explicitly.
trimesh           = { extras = ["easy"], version = "^4.4.0" }
numpy             = ">=1.26.0,<3.0.0"

# ─── NOT pip-installable — install outside Poetry ───────────────────────────
# ifcopenshell  → conda-forge or custom .whl (see Render deployment notes)
# gltf-pipeline, gltf-validator, xeokit-convert → npm install -g (see build cmd)
ifcopenshell = "^0.8.5"

# STEP pipeline — OCCT Python bindings.
# NOTE: pythonocc-core (the package step.py's error messages historically
# referenced) has no current PyPI wheel — its PyPI page is a stale, abandoned
# 0.16 release from 2021; the only maintained pythonocc-core distribution
# channel is conda-forge, which doesn't cross-copy cleanly into this
# python:3.12-slim (Debian) image. cadquery-ocp-novtk wraps the same OCCT
# library and publishes real, current, manylinux_2_31 wheels for cp312 on
# PyPI — genuinely pip-installable, no conda required. Its Python import
# namespace is `OCP.*`, not `OCC.Core.*` — apps/worker/app/tasks/step.py's
# imports were updated to match (same OCCT classes/call signatures, only
# the binding's module path differs).
cadquery-ocp-novtk = "^7.9.3.0"

[tool.poetry.group.dev.dependencies]
pytest         = "^8.3.0"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  ".",
]
testpaths = [
  "tests",
]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[build-system]
requires      = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"