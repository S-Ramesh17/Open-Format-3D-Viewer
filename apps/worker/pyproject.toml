[tool.poetry]
name = "openformat-worker"
version = "0.1.0"
description = "Open Format Celery worker"
authors = ["-"]
package-mode = false

[tool.poetry.dependencies]
python            = ">=3.12,<3.13"
requests = "^2.34.2"

# Task queue / broker
celery            = { extras = ["redis"], version = "^5.4.0" }
redis             = "^5.2.0"

# Database (sync — worker uses create_engine, not async)
sqlalchemy        = "^2.0.36"
psycopg2-binary   = "^2.9.10"

# Cloud & storage
boto3             = "^1.35.0"

# Config
pydantic-settings = "^2.7.0"

# Observability
sentry-sdk        = { extras = ["celery"], version = "^2.19.0" }

prometheus-client  = "^0.21.0"

# Mesh processing — STL + OBJ pipelines
# trimesh[easy] brings in numpy, scipy, shapely, rtree etc.
# If the Render build fails on pyembree/manifold3d native code,
# replace `trimesh[easy]` with `trimesh` (bare) and add `numpy` explicitly.
trimesh           = { extras = ["easy"], version = "^4.4.0" }
numpy             = ">=1.26.0,<3.0.0"

# ─── NOT pip-installable — install outside Poetry ───────────────────────────
# ifcopenshell  → conda-forge or custom .whl (see Render deployment notes)
# pythonocc-core → conda-forge or custom .whl
# gltf-pipeline, gltf-validator, xeokit-convert → npm install -g (see build cmd)
ifcopenshell = "^0.8.5"

[tool.poetry.group.dev.dependencies]
pytest         = "^8.3.0"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
asyncio_mode  = "auto"
pythonpath    = ["."]
testpaths     = ["tests"]

[build-system]
requires      = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"