# docker-compose.yml — local development stack
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openformat
      POSTGRES_PASSWORD: openformat
      POSTGRES_DB: openformat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openformat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://openformat:openformat@postgres:5432/openformat
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/openformat
    volumes:
      - uploads_data:/data/openformat
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: apps/worker/.env
        required: false
    environment:
      DATABASE_URL: postgresql://openformat:openformat@postgres:5432/openformat
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /data/openformat
    volumes:
      - uploads_data:/data/openformat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  ws-server:
    build:
      context: apps/ws-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: apps/ws-server/.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data: